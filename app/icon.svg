<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MEGA TEST DRIVE 6">
  <!-- The edition number on the hero's ground, in the red sampled from the
       lockup. Drawn as strokes rather than set as <text>: a favicon renders in
       browser chrome, where the page's webfont does not exist and a text
       element would fall back to whatever the OS happens to have. -->
  <rect width="64" height="64" fill="#08090b" />
  <g fill="none" stroke="#e81820" stroke-width="7" stroke-linecap="round">
    <circle cx="32" cy="41" r="12" />
    <path d="M20 41C20 22 28 13 43 11" />
  </g>
</svg>
